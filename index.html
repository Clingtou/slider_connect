<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gain and Loss Amount Rating</title>

  <script src="https://unpkg.com/jspsych@7.1.2/dist/index.browser.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.0/dist/index.browser.js"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.1.0/dist/index.browser.js"></script>
  <link href="https://unpkg.com/jspsych@7.1.2/css/jspsych.css" rel="stylesheet" type="text/css" />

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: rgb(128, 128, 128);
      font-family: Arial, "Microsoft YaHei", "SimHei", sans-serif;
    }

    .jspsych-display-element,
    .jspsych-content-wrapper,
    #jspsych-content {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      background: rgb(128, 128, 128) !important;
      overflow: hidden !important;
    }

    html.fullscreen-entry-transition,
    html.fullscreen-entry-transition body,
    html.fullscreen-entry-transition .jspsych-display-element,
    html.fullscreen-entry-transition .jspsych-content-wrapper,
    html.fullscreen-entry-transition #jspsych-content {
      background: #fff !important;
    }

    .fullscreen-start-screen {
      box-sizing: border-box;
      width: min(900px, calc(100vw - 80px));
      margin: 0 auto 36px auto;
      background: transparent;
      color: black;
      display: block;
      text-align: center;
      font-size: 28px;
      line-height: 1.7;
    }

    .jspsych-btn,
    .survey-next-btn {
      display: block;
      margin: 0 auto !important;
      font-size: 27px !important;
      padding: 12px 30px !important;
      border-radius: 6px !important;
      border: 1px solid #777;
      background: white;
      color: black;
      cursor: pointer !important;
    }

    .matlab-screen {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgb(128, 128, 128);
      color: rgb(0, 0, 0);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
      cursor: none;
    }

    .matlab-text {
      white-space: pre-line;
      font-family: Arial, sans-serif;
      font-size: clamp(18px, 2.5vh, 32px);
      line-height: 1.35;
      color: rgb(0, 0, 0);
      text-align: center;
      max-width: 92vw;
    }

    .fixation-screen {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgb(128, 128, 128);
      overflow: hidden;
      cursor: none;
    }

    .fixation-dot {
      position: absolute;
      left: 50vw;
      top: 50vh;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgb(255, 255, 255);
      transform: translate(-50%, -50%);
    }

    .axis-screen {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgb(128, 128, 128);
      color: white;
      overflow: hidden;
      cursor: auto;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .countdown {
      position: absolute;
      top: 5vh;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 32px;
      line-height: 1;
      text-align: center;
      user-select: none;
    }

    /* 数字对位置：按照 index左右.html 中的 num-row / num-box 定位方式。
       修改 top 可上下移动数字对；数值越小越靠上。 */
    .stim-num-row {
      position: absolute;
      top: 23vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 15vw;
      color: white;
      line-height: 1;
      user-select: none;
    }

    .stim-num-box {
      width: 22vw;
      height: 26vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-weight: normal;
      line-height: 1;
      user-select: none;
    }

    .stim-left,
    .stim-right { position: static; }

    /* 还原 MATLAB 200pt / 500pt 在 1920×1080 下的高度比例。 */
    .font-small { font-size: 18.5vh; }
    .font-large { font-size: 46vh; }

    .axis-block {
      position: absolute;
      top: 68vh; /* 修改这里可以上下移动评分线整体：数值越大越靠下。 */
      left: 50%;
      transform: translateX(-50%);
      width: min(1080px, 76vw);
      text-align: center;
      color: white;
    }

    .axis-question {
      color: white;
      font-size: 24px;
      line-height: 1.25;
      margin-bottom: 20px;
    }

    .axis-rating-question {
      width: max-content;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: min(24px, 2vw);
    }

    .axis-emphasis {
      color: white;
      font-weight: bold;
    }

    .slider-wrap {
      position: relative;
      width: 100%;
      margin: 0 auto;
      padding: 22px 0 16px 0;
    }

    input.axis-slider {
      width: 100%;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: rgba(255,255,255,0.85);
      border-radius: 3px;
      outline: none;
    }

    input.axis-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: white;
      border: 2px solid rgba(255,255,255,0.92);
      box-shadow: 0 1px 6px rgba(0,0,0,0.28);
      cursor: pointer;
    }

    input.axis-slider::-moz-range-thumb {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: white;
      border: 2px solid rgba(255,255,255,0.92);
      box-shadow: 0 1px 6px rgba(0,0,0,0.28);
      cursor: pointer;
    }

    /* 初始状态不显示滑块圆点：被试第一次点击评分线后圆点才出现。 */
    input.axis-slider.unmoved::-webkit-slider-thumb { opacity: 0; }
    input.axis-slider.unmoved::-moz-range-thumb { opacity: 0; }

    .axis-label-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      line-height: 1;
      margin-top: 6px;
      user-select: none;
    }

    .axis-label-row span {
      color: white;
      font-size: 24px;
      line-height: 1;
      user-select: none;
    }

    .axis-submit-wrap {
      position: absolute;
      left: 50%;
      bottom: 9vh;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
    }

    .axis-submit-btn {
      display: block;
      margin: 0 auto;
      font-size: 24px;
      padding: 10px 28px;
      border-radius: 6px;
      border: 1px solid #777;
      background: white;
      color: black;
      cursor: pointer;
    }

    .submission-screen,
    .abort-screen {
      width: 100vw;
      height: 100vh;
      background: rgb(128, 128, 128);
      color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: "SimHei", "Microsoft YaHei", Arial, sans-serif;
      overflow: hidden;
      cursor: auto;
    }

    .submission-screen {
      box-sizing: border-box;
      padding: 32px;
      flex-direction: column;
      overflow-y: auto;
      font-family: Arial, sans-serif;
      font-size: clamp(18px, 2.5vh, 28px);
      line-height: 1.5;
    }

    .submission-screen p { max-width: 900px; margin: 0 0 20px; }
    .submission-screen button, .submission-screen a {
      margin: 8px !important;
      font-size: 22px !important;
    }

    .abort-screen {
      font-size: 40px;
      font-weight: bold;
      line-height: 1.5;
    }
    /* Entry pages only: the rating and fixation screens keep their existing styles. */
    .setup-page {
      position: fixed; inset: 0; overflow-y: auto; background: #fff;
      color: #1f2937; cursor: auto; font-family: Arial, Helvetica, sans-serif;
      text-align: left;
    }
    .study-shell { width: min(1100px, calc(100% - 64px)); margin: 46px auto; }
    .qualtrics-topbar {
      background: #2f80ed; color: white; padding: 20px 28px;
      border-radius: 8px 8px 0 0; font-size: 23px; font-weight: 700;
    }
    .qualtrics-card {
      border: 1px solid #d9dfe7; border-top: none; border-radius: 0 0 8px 8px;
      padding: 42px 52px; box-shadow: 0 2px 8px rgba(31,41,55,.06);
    }
    .setup-page h2 { font-size: 30px; line-height: 1.3; margin: 0 0 28px; text-align: center; }
    .setup-page p, .setup-page li { font-size: 20px; line-height: 1.58; }
    .setup-page p { margin: 20px 0; }
    .setup-page li { margin: 16px 0; }
    .setup-page .doc-red { color: #c00000; font-weight: 700; }
    .setup-page .gray-highlight { background: rgb(128, 128, 128); color: white; font-size: 22px; padding: 1px 5px; }
    .setup-page .instruction-figure { display: block; width: min(654.5px, 85%); height: auto; margin: 26px auto; }
    .setup-page .instruction-figure-small { width: min(510px, 85%); }
    .setup-page .fixation-figure { width: min(400px, 100%); }
    .setup-page .jspsych-btn, #jspsych-content:has(.fullscreen-message) .jspsych-btn {
      background: #2f80ed; color: #fff; border: 1px solid #1f5fbf;
      border-radius: 4px; padding: 12px 28px; font-size: 19px !important;
      margin: 26px 0 0 !important;
    }
    .setup-page .jspsych-btn:disabled, #jspsych-content:has(.fullscreen-message) .jspsych-btn:disabled {
      opacity: .48; cursor: not-allowed !important;
    }
    .human-verification-form {
      box-sizing: border-box; width: min(640px, calc(100% - 48px)); min-height: 100vh;
      margin: 0 auto; padding: 28px 0 84px; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .verification-question { color: #555; font-size: 20px; font-weight: 700; line-height: 1.35; margin-bottom: 22px; text-align: center; }
    .verification-image { display: block; width: min(392px, 100%); height: auto; margin-bottom: 22px; }
    .verification-options { display: grid; gap: 10px; width: 140px; }
    .verification-options label { display: flex; align-items: center; gap: 12px; padding: 6px 0; color: #555; font-size: 19px; cursor: pointer; }
    .verification-options input { width: 18px; height: 18px; margin: 0; accent-color: #2f80ed; }
    .verification-options label:hover, .verification-options label:has(input:checked) { background: #eef5ff; color: #1f5fbf; font-weight: 700; }
    .fullscreen-message { width: min(980px, calc(100vw - 72px)); margin: 0 auto 20px; text-align: left; color: #1f2937; }
    .fullscreen-message h2 { font-size: 30px; line-height: 1.25; margin: 0 0 16px; text-align: center; }
    .fullscreen-message p { font-size: 19px; line-height: 1.72; margin: 11px 0; }
    .fullscreen-warning { color: #b42318; }
    .fullscreen-consent { display: flex; align-items: center; gap: 12px; margin-top: 18px; font-size: 19px; font-weight: 700; cursor: pointer; }
    .fullscreen-consent input { flex-shrink: 0; width: 20px; height: 20px; margin: 0; accent-color: #2f80ed; }
    #jspsych-content:has(.fullscreen-message) {
      box-sizing: border-box; display: block; padding: 6vh 0 40px !important;
      background: #fff !important; overflow-y: auto !important; text-align: left;
    }
    #jspsych-content:has(.fullscreen-message) .jspsych-btn { margin-left: max(36px, calc((100vw - 980px) / 2)) !important; }
    .setup-page .questionnaire-field { border: 0; padding: 0; margin: 40px 0; min-width: 0; }
    .setup-page .questionnaire-field legend { font-size: 20px; line-height: 1.5; font-weight: 700; margin-bottom: 14px; }
    .setup-page .questionnaire-options { display: grid; gap: 10px; }
    .setup-page .questionnaire-option { display: flex; align-items: baseline; gap: 12px; font-size: 19px; line-height: 1.5; cursor: pointer; }
    .setup-page .questionnaire-option input { flex-shrink: 0; width: 20px; height: 20px; margin: 0; accent-color: #111; }
    .setup-page .questionnaire-options:not(.questionnaire-scale) > .questionnaire-option { box-sizing: border-box; align-items: center; padding: 12px 16px; border: 1px solid #999; background: #fff; color: #111; }
    .setup-page .questionnaire-options:not(.questionnaire-scale) > .questionnaire-option:hover { background: #f7f7f7; }
    .setup-page .questionnaire-options:not(.questionnaire-scale) > .questionnaire-option:has(input:checked) { border-color: #111; background: #f3f3f3; }
    .setup-page .questionnaire-options:not(.questionnaire-scale) > .questionnaire-option:has(input:focus-visible) { outline: 2px solid #111; outline-offset: 2px; }
    .setup-page .questionnaire-scale-block { width: min(600px, 100%); }
    .setup-page .questionnaire-scale { display: grid; grid-template-columns: repeat(var(--scale-count), minmax(0, 1fr)); gap: 10px; }
    .setup-page .questionnaire-scale .questionnaire-option { position: relative; display: block; min-width: 0; }
    .setup-page .questionnaire-scale .questionnaire-option input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .setup-page .questionnaire-scale .questionnaire-option span { display: block; padding: 5px 0; border: 1px solid #888; border-radius: 8px; text-align: center; color: #555; background: #fff; font-size: 20px; }
    .setup-page .questionnaire-scale .questionnaire-option:hover span { background: #f7f7f7; }
    .setup-page .questionnaire-scale .questionnaire-option input:checked + span { border-color: #111; background: #f3f3f3; color: #111; }
    .setup-page .questionnaire-scale .questionnaire-option input:focus-visible + span { outline: 2px solid #111; outline-offset: 3px; }
    .setup-page .scale-endpoints { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 10px; font-size: 17px; line-height: 1.4; }
    .setup-page .scale-endpoints span:last-child { text-align: right; }
    .setup-page .ladder-figure { display: block; width: min(320px, 100%); height: auto; margin: 24px auto; }
    .setup-page .questionnaire-comments { display: block; box-sizing: border-box; width: 100%; min-height: 180px; padding: 14px; font: 19px/1.5 Arial, sans-serif; border: 1px solid #9ca3af; border-radius: 4px; resize: vertical; }
  </style>
</head>

<body><noscript>This task requires JavaScript. Please enable it and reopen the study link.</noscript></body>

<script>
  // STUDY SETTINGS: paste the completion URL OR code from your Connect project.
  // Completion settings may be left blank; data saving does not depend on them.
  // Only ?preview=1 enables preview, which never uploads or returns a completion code.
  var DATAPIPE_EXPERIMENT_ID = 'SxwHNCUzbN5m';
  var CONNECT_COMPLETION_URL = 'https://connect.cloudresearch.com/participant/project/02C29A2CB0/complete';
  var CONNECT_COMPLETION_CODE = '02C29A2CB0';
  var STUDY_VERSION = 'connect-en-2026-10-28';

  if (typeof initJsPsych !== 'function' || typeof jsPsychHtmlKeyboardResponse === 'undefined' || typeof jsPsychFullscreen === 'undefined') {
    document.body.innerHTML = '<div class="submission-screen"><p>The task could not load. Please check your connection and reopen the study link.</p></div>';
    throw new Error('jsPsych dependency failed to load.');
  }

  var urlParameters = new URLSearchParams(window.location.search);
  var previewMode = urlParameters.get('preview') === '1';
  var connectParticipantId = urlParameters.get('participantId') || urlParameters.get('CONNECT_PID') || '';
  var connectProjectId = urlParameters.get('projectId') || urlParameters.get('PROJECT_ID') || '';
  var connectAssignmentId = urlParameters.get('assignmentId') || urlParameters.get('ASSIGNMENT_ID') || '';
  var anonymousGithubMode = !connectParticipantId && window.location.origin === 'https://clingtou.github.io' &&
    ['/slider_connect/', '/slider_connect/index.html'].indexOf(window.location.pathname) !== -1;
  var participantStateEnabled = !previewMode && !!connectParticipantId;
  if (!connectParticipantId) {
    connectProjectId = '';
    connectAssignmentId = '';
  }
  var sessionId = (window.crypto && typeof window.crypto.randomUUID === 'function') ? window.crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
  var sessionStartedAt = new Date().toISOString();
  var submission = null;
  var uploadInProgress = false;
  var uploadAccepted = false;
  var backupKey = 'gain-loss:' + DATAPIPE_EXPERIMENT_ID + ':' + connectParticipantId + ':' + connectProjectId + ':' + connectAssignmentId;
  var studyLockKey = 'gain-loss-status:' + DATAPIPE_EXPERIMENT_ID + ':' + connectParticipantId + ':' + connectProjectId;
  var fullscreenAbortArmed = false;
  var plannedFullscreenExit = false;
  var entryBlockMessage = '';
  var comprehensionAttempt = 0;
  var comprehensionPassed = false;
  var comprehensionWrongQuestions = [];
  var terminationReason = '';
  var fullscreenRestartBlocked = false;
  var fullscreenExitRestartMessage = 'You cannot take this study again because you previously exited full-screen mode after practice began.';

  var jsPsych = initJsPsych({
    use_webaudio: false,
    on_finish: function () {
      window.gain_loss_magnitude_data_json = jsPsych.data.get().json();
      window.gain_loss_magnitude_data_csv = getCleanCsv();
      if (entryBlockMessage) { showEntryEnd(entryBlockMessage); return; }
      prepareSubmission();
    }
  });

  var timeline = [];
  var bkRgb = 'rgb(128, 128, 128)';
  var fontRgb = 'rgb(0, 0, 0)';
  var stimRgb = 'rgb(255, 255, 255)';
  var experimentStarted = false;
  var practiceStarted = false;
  var experimentCompleted = false;
  var experimentAborted = false;
  var experimentStartPerfTime = performance.now();

  function getElapsedTime() {
    return Math.round(performance.now() - experimentStartPerfTime);
  }

  function addElapsedTime(data) {
    data.elapsed_time = getElapsedTime();
  }

  function getScreenResolution() {
    return String(window.screen.width) + 'x' + String(window.screen.height);
  }

  var participantId = connectParticipantId;

  jsPsych.data.addProperties({
    Subject: participantId,
    connect_participant_id: connectParticipantId,
    connect_project_id: connectProjectId,
    connect_assignment_id: connectAssignmentId,
    experiment_id: DATAPIPE_EXPERIMENT_ID,
    session_id: sessionId,
    session_started_at: sessionStartedAt,
    study_version: STUDY_VERSION,
    language: 'en',
    preview: previewMode ? 1 : 0,
    session_status: 'in_progress',
    fullscreen_exit_abort: 0,
    screen_resolution: getScreenResolution()
  });

  var practiceStartText = 'You will begin with 3 practice trials.\n\nYour practice responses will not be included in the main analysis.\n\nPlease press the "SPACEBAR" to begin practice.';
  var startText = 'Practice completed! The main task is about to begin.\n\nYour decision time will be recorded, so once the task begins, please do not get distracted.\n\nPlease stay focused until you finish the task.\n\nIf you are ready, press the "SPACEBAR" to start immediately.';

  function instructionScreen(text) {
    return {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: '<div class="matlab-screen" style="background:' + bkRgb + '; color:' + fontRgb + ';"><div class="matlab-text">' + text + '</div></div>',
      choices: [' '],
      data: { task_trial_index: 0, trial_part: 'instruction' },
      on_finish: addElapsedTime
    };
  }

  function setupShell(content) {
    return '<div class="setup-page"><div class="study-shell"><div class="qualtrics-topbar">Monetary Amount Rating Task</div><div class="qualtrics-card">' + content + '</div></div></div>';
  }

  function ratingExampleHtml(smaller) {
    // Static illustration of the existing rating screen: gain large, loss small.
    return '<svg class="instruction-figure' + (smaller ? ' instruction-figure-small' : '') + '" viewBox="0 0 1920 1080" role="img" aria-label="Example rating screen: large +7 on the left, small minus 4 on the right, aligned along the bottom, and a loss rating scale with no initial marker." xmlns="http://www.w3.org/2000/svg">' +
      '<rect width="1920" height="1080" fill="rgb(128,128,128)"/>' +
      '<g fill="white" font-family="Microsoft YaHei, Arial, sans-serif" text-anchor="middle">' +
      '<text x="605" y="580" font-size="496.8">+7</text>' +
      '<text x="1315" y="580" font-size="199.8">-4</text>' +
      '<text x="960" y="764" font-size="36">Based on your first impression, please rate how large the <tspan font-weight="bold">loss amount</tspan> above seems to you.</text>' +
      '<text x="360" y="905" text-anchor="start" font-size="40">Very small</text>' +
      '<text x="1560" y="905" text-anchor="end" font-size="40">Very large</text></g>' +
      '<line x1="420" y1="860" x2="1500" y2="860" stroke="white" stroke-opacity=".85" stroke-width="6" stroke-linecap="round"/></svg>';
  }

  var instructionPages = [
    '<h2><strong>Monetary Amount Rating Task</strong></h2>' +
    '<p>In this task, you will see two monetary amounts at the same time. A positive number indicates a gain, and a negative number indicates a loss. All amounts are in US dollars. The dollar sign is omitted from the amounts shown on screen.</p>' +
    '<p>On each trial, you will be asked to rate either the gain amount or the loss amount. Based on <strong class="doc-red">your first impression</strong>, please indicate how large that amount seems to you by clicking on the rating scale below the numbers. <strong>The left end of the scale is labeled “<span class="doc-red">Very small</span>,” and the right end is labeled “<span class="doc-red">Very large</span>.”</strong></p>' +
    '<p><u>The larger the amount seems to you, the farther to the right you should click. The smaller it seems, the farther to the left you should click.</u> <strong>The gain and loss amounts range from $3 to $9, <span class="doc-red">inclusive</span>.</strong> You do not need to place the smallest amount at the far-left endpoint or the largest amount at the far-right endpoint.</p>' +
    '<p>For example, in the display below, “<strong>+7</strong>” represents a gain of $7, and “<strong>−4</strong>” represents a loss of $4. In this example, the prompt asks you to rate the loss amount, so the amount you are rating is $4. Please <strong class="doc-red">click on the scale</strong> to submit your rating, and it will then automatically advance to the next trial.</p>' +
    ratingExampleHtml() + '<p>If everything is clear, click <strong>“Next”</strong> to continue.</p>',

    ratingExampleHtml(true) + '<p>Please note:</p><ol>' +
    '<li>The two numbers may appear in <strong>different font sizes</strong>, as shown above. It is not relevant to your rating.</li>' +
    '<li>On each trial, you will be asked to rate either the gain amount or the loss amount. Which amount you rate will be <strong>determined at random</strong>. Please read the prompt on each trial.</li>' +
    '<li><strong>Your response <span class="doc-red">cannot be changed</span> once you <span class="doc-red">click</span> the slider.</strong> The scale has no preselected response. Your response will be recorded immediately, and the task will automatically advance to the next trial.</li>' +
    '<li>You will complete <strong>3 practice trials</strong> before the main task begins.</li></ol>' +

    var content = '<h2>Comprehension Check</h2><p>Please answer the following questions to check your understanding of the task.</p>' +
      radioQuestion('comprehension_q1', '1. What should you rate on each trial, based on your first impression?', [

        ['B', 'The font size used to display either the gain amount or the loss amount.'],
        ['C', 'How large either the gain amount or the loss amount seems to you, as specified in the prompt.'],
        ['D', 'How large both the gain amount and the loss amount seem to you, at the same time.']
      ]) +
      radioQuestion('comprehension_q2', '2. Which statement about the numbers shown on each trial is correct?', [
        ['A', 'A number shown on the screen could be 10.'],
        ['B', 'The smallest possible number is -1.'],
        ['C', 'The numbers range from 3 to 9.'],
        ['D', 'The absolute values of the numbers range from 3 to 9.']
      ]) +
      radioQuestion('comprehension_q3', '3. Which statement about the rating scale is correct?', [
        ['A', 'The left endpoint is 3, and the right endpoint is 9.'],
        ['B', 'The left endpoint is “Very small,” and the right endpoint is “Very large.”'],
        ['C', 'The left endpoint is 1, and the right endpoint is 10.']
      ]) +
      radioQuestion('comprehension_q4', '4. Which of the following statements about the task is correct?', [
        ['A', 'You need to take the font sizes of the numbers into account.'],
        ['B', 'Because positive numbers are greater than negative numbers, a gain amount must receive a higher rating than a loss amount.'],
        ['C', 'Once you click on the scale, you cannot change your response.'],
        ['D', 'You need to click when the small dot appears on the screen.']
      ]);
    var fields = [1, 2, 3, 4].map(function (number) { return { name: 'comprehension_q' + number }; });
    return questionnaireTrial('comprehension_check', 1, content, fields, function (result) {
      var correct = ['C', 'D', 'B', 'C'];
      comprehensionWrongQuestions = [];
      correct.forEach(function (answer, index) {
        if (result['comprehension_q' + (index + 1)] !== answer) comprehensionWrongQuestions.push(index + 1);
      });
      comprehensionPassed = comprehensionWrongQuestions.length === 0;
      result.comprehension_attempt = comprehensionAttempt;

  function generatePracticeTrials() {
    var practiceBase = [
      { pair_id: 'practice_1', gamble_index: 'practice_1', gain_number: 4, loss_number: -6, loss_abs_number: 6 },
      { pair_id: 'practice_2', gamble_index: 'practice_2', gain_number: 8, loss_number: -5, loss_abs_number: 5 },
      { pair_id: 'practice_3', gamble_index: 'practice_3', gain_number: 7, loss_number: -7, loss_abs_number: 7 }
    ];

    var practiceTrials = [];

    for (var i = 0; i < practiceBase.length; i++) {
      var item = practiceBase[i];
      var gainOnLeft = Math.random() < 0.5 ? 1 : 0;
      var gainFontLarger = Math.random() < 0.5 ? 1 : 0;
      var targetValence = Math.random() < 0.5 ? 'gain' : 'loss';
      var leftNumber = gainOnLeft === 1 ? item.gain_number : item.loss_number;
      var rightNumber = gainOnLeft === 1 ? item.loss_number : item.gain_number;
      var largerFontOnLeft = gainFontLarger === 1 ? gainOnLeft : (gainOnLeft === 1 ? 0 : 1);
      var targetNumber = targetValence === 'gain' ? item.gain_number : item.loss_number;
      var targetSide = (targetValence === 'gain' && gainOnLeft === 1) || (targetValence === 'loss' && gainOnLeft === 0) ? 'left' : 'right';
      var targetFontSize = targetValence === 'gain' ? (gainFontLarger === 1 ? 'large' : 'small') : (gainFontLarger === 1 ? 'small' : 'large');

      practiceTrials.push({
        pair_id: item.pair_id,
        gamble_index: item.gamble_index,
        gain_number: item.gain_number,
        loss_number: item.loss_number,
        loss_abs_number: item.loss_abs_number,
        gain_on_left: gainOnLeft,
        left_number: leftNumber,
        right_number: rightNumber,
        gain_font_larger: gainFontLarger,
        loss_font_larger: gainFontLarger === 1 ? 0 : 1,
        larger_font_on_left: largerFontOnLeft,
        font_congruency: gainFontLarger,
        target_valence: targetValence,
        target_side: targetSide,
        target_number: targetNumber,
        target_abs_number: Math.abs(targetNumber),
        target_font_size: targetFontSize,
        task_trial_index: 'practice_' + (i + 1),
        trial_part: 'practice'
      });
    }

    return practiceTrials;
  }

  function generateGainLossTrials() {
    var gambles = [];
    var gambleIndex = 1;

    for (var gain = 3; gain <= 9; gain++) {
      for (var lossAbs = 3; lossAbs <= 9; lossAbs++) {
        var gainOnLeft = Math.random() < 0.5 ? 1 : 0;
        var loss = -lossAbs;
        var leftNumber = gainOnLeft === 1 ? gain : loss;
        var rightNumber = gainOnLeft === 1 ? loss : gain;

        gambles.push({
          pair_id: 'G' + gain + '_L' + lossAbs,
          gamble_index: gambleIndex,
          gain_number: gain,
          loss_number: loss,
          loss_abs_number: lossAbs,
          gain_on_left: gainOnLeft,
          left_number: leftNumber,
          right_number: rightNumber
        });
        gambleIndex++;
      }
    }

    var uniqueTrials = [];

    for (var i = 0; i < gambles.length; i++) {
      var gamble = gambles[i];
      var fontOrder = jsPsych.randomization.shuffle([1, 0]); // 1 = 收益大字体；0 = 损失大字体

      for (var f = 0; f < fontOrder.length; f++) {
        uniqueTrials.push({
          gamble: gamble,
          gain_font_larger: fontOrder[f],
          first_target_valence: Math.random() < 0.5 ? 'gain' : 'loss'
        });
      }
    }

    uniqueTrials = jsPsych.randomization.shuffle(uniqueTrials);

    function makeTrial(uniqueItem, targetValence, targetPass, uniqueTrialIndex) {
      var gamble = uniqueItem.gamble;
      var gainFontLarger = uniqueItem.gain_font_larger;
      var largerFontOnLeft = gainFontLarger === 1 ? gamble.gain_on_left : (gamble.gain_on_left === 1 ? 0 : 1);
      var targetNumber = targetValence === 'gain' ? gamble.gain_number : gamble.loss_number;
      var targetAbsNumber = Math.abs(targetNumber);
      var targetSide = (targetValence === 'gain' && gamble.gain_on_left === 1) || (targetValence === 'loss' && gamble.gain_on_left === 0) ? 'left' : 'right';
      var targetFontSize = targetValence === 'gain' ? (gainFontLarger === 1 ? 'large' : 'small') : (gainFontLarger === 1 ? 'small' : 'large');

      return {
        pair_id: gamble.pair_id,
        gamble_index: gamble.gamble_index,
        unique_trial_id: gamble.pair_id + '_font' + gainFontLarger,
        unique_trial_index: uniqueTrialIndex,
        target_pass: targetPass,
        gain_number: gamble.gain_number,
        loss_number: gamble.loss_number,
        loss_abs_number: gamble.loss_abs_number,
        gain_on_left: gamble.gain_on_left,
        left_number: gamble.left_number,
        right_number: gamble.right_number,
        gain_font_larger: gainFontLarger,
        loss_font_larger: gainFontLarger === 1 ? 0 : 1,
        larger_font_on_left: largerFontOnLeft,
        font_congruency: gainFontLarger,
        target_valence: targetValence,
        target_side: targetSide,
        target_number: targetNumber,
        target_abs_number: targetAbsNumber,
        target_font_size: targetFontSize,
        trial_part: 'axis_rating'
      };
    }

    var trials = [];

    // 第一遍：98 个独特试次，顺序随机；每个试次随机评价 gain 或 loss。
    for (var j = 0; j < uniqueTrials.length; j++) {
      trials.push(makeTrial(uniqueTrials[j], uniqueTrials[j].first_target_valence, 1, j + 1));
    }

    // 第二遍：严格按照第一遍 98 个独特试次的顺序；评价另一个数字。
    for (var k = 0; k < uniqueTrials.length; k++) {
      var secondTarget = uniqueTrials[k].first_target_valence === 'gain' ? 'loss' : 'gain';
      trials.push(makeTrial(uniqueTrials[k], secondTarget, 2, k + 1));
    }

    for (var n = 0; n < trials.length; n++) { trials[n].task_trial_index = n + 1; }
    return trials;
  }

      },
      on_load: function () {

    var controller = new AbortController();
    var timeoutId = setTimeout(function () { controller.abort(); }, 65000);
    try {
      var response = await fetch('https://pipe.jspsych.org/api/data/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          experimentID: DATAPIPE_EXPERIMENT_ID,
          filename: submission.filename,
          data: submission.csv

        signal: controller.signal

      // 202 means DataPipe has accepted the data into its durable queue.

      var accepted = response.ok && !result.error && (response.status === 202 || ((response.status === 200 || response.status === 201) && result.message === 'Success'));

    var mobileLike = /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent || '');
    if (mobileLike || window.innerWidth < 900 || window.innerHeight < 600) {
      showMessage(mobileLike ? 'This study must be completed on a desktop or laptop computer. Please return the study on Connect and do not continue on this device.' : 'Please maximize your browser window and refresh the page to continue. This study requires a window of at least 900 x 600 pixels.');
      if (!mobileLike) addButton('Refresh after maximizing', function () { window.location.reload(); });
      return;
    }
    jsPsych.run(timeline);
  }

  startStudy();
</script>
</html>
